name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Replicera.sln --locked-mode
      - run: dotnet build Replicera.sln --no-restore --configuration Release
      - run: dotnet test Replicera.sln --no-build --configuration Release --filter "Category!=Credentialed&Category!=SqlServerIntegration&Category!=PostgreSqlIntegration&Category!=OracleIntegration&Category!=DataverseSqlEndToEnd&Category!=DataverseOracleEndToEnd&Category!=Scale"

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: dotnet restore Replicera.sln --locked-mode
      - run: dotnet format Replicera.sln --no-restore --verify-no-changes
      - name: Check third-party notices
        run: python3 scripts/generate_third_party_notices.py --check

  sql-server-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Replicera.sln --locked-mode
      - run: scripts/run-sqlserver-integration-tests.sh

  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Replicera.sln --locked-mode
      - run: scripts/run-postgresql-integration-tests.sh

  oracle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Replicera.sln --locked-mode
      - run: scripts/run-oracle-integration-tests.sh

  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore Replicera.sln --locked-mode
      - run: scripts/run-scale-test.sh

  publish-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            executable: replicera
          - os: windows-latest
            runtime: win-x64
            executable: replicera.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Publish framework-dependent artifact
        run: dotnet publish src/Replicera.Cli/Replicera.Cli.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained false --output artifacts/framework-dependent -p:RestoreLockedMode=true
      - name: Smoke-test framework-dependent artifact
        shell: pwsh
        run: '& (Join-Path "artifacts/framework-dependent" "${{ matrix.executable }}") --help'
      - name: Publish self-contained artifact
        run: dotnet publish src/Replicera.Cli/Replicera.Cli.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true --output artifacts/self-contained -p:RestoreLockedMode=true
      - name: Smoke-test self-contained artifact
        shell: pwsh
        run: '& (Join-Path "artifacts/self-contained" "${{ matrix.executable }}") --help'
      - name: Build versioned release package
        run: python scripts/package_release.py --version 0.1.0-ci --runtime ${{ matrix.runtime }}
      - name: Smoke-test extracted release package
        shell: pwsh
        run: |
          $package = "replicera-0.1.0-ci-${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path artifacts/extracted | Out-Null
          if ('${{ matrix.runtime }}'.StartsWith('win-')) {
            Expand-Archive "artifacts/packages/$package.zip" -DestinationPath artifacts/extracted
          } else {
            tar -xzf "artifacts/packages/$package.tar.gz" -C artifacts/extracted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & (Join-Path "artifacts/extracted/$package" "${{ matrix.executable }}") --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: replicera-${{ matrix.runtime }}
          path: artifacts/
          if-no-files-found: error
