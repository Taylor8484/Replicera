name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runtime: linux-x64
            executable: replicera
          - os: windows-latest
            runtime: win-x64
            executable: replicera.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json
      - name: Derive version
        id: version
        shell: pwsh
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Package release
        run: python scripts/package_release.py --version ${{ steps.version.outputs.version }} --runtime ${{ matrix.runtime }}
      - name: Select archive
        id: archive
        shell: pwsh
        run: |
          $extension = if ('${{ matrix.runtime }}'.StartsWith('win-')) { 'zip' } else { 'tar.gz' }
          "path=artifacts/packages/replicera-${{ steps.version.outputs.version }}-${{ matrix.runtime }}.$extension" >> $env:GITHUB_OUTPUT
      - name: Smoke test packaged executable
        shell: pwsh
        run: |
          if ('${{ matrix.runtime }}'.StartsWith('win-')) {
            Expand-Archive '${{ steps.archive.outputs.path }}' -DestinationPath artifacts/extracted
          } else {
            New-Item -ItemType Directory -Force -Path artifacts/extracted | Out-Null
            tar -xzf '${{ steps.archive.outputs.path }}' -C artifacts/extracted
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & (Join-Path "artifacts/extracted/replicera-${{ steps.version.outputs.version }}-${{ matrix.runtime }}" "${{ matrix.executable }}") --version
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.runtime }}
          path: artifacts/packages/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: release-*
          path: release-files
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "${GITHUB_REF_NAME}" release-files/* --verify-tag --generate-notes
