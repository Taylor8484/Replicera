version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # xunit.v3 4.x requires the Microsoft Testing Platform runner, which changes how
      # dotnet test and its filters work; adopt it as a planned migration, not a bump.
      - dependency-name: xunit.v3
        update-types: [version-update:semver-major]
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
